<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2E75B6">
<title>勤怠申請（西軽精機）</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 24px 16px 60px;
    color: #1b2430;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    padding: 28px 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: #1F4E79;
  }
  .sub {
    font-size: 13px;
    color: #666;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 18px 0 6px;
  }
  input[type="date"], input[type="time"], textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  .hint {
    font-size: 12.5px;
    color: #2E75B6;
    margin-top: 6px;
    min-height: 1.2em;
  }
  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14.5px;
  }
  .radio-pill:has(input:checked) {
    border-color: #2E75B6;
    background: #eaf2fa;
    font-weight: 700;
    color: #1F4E79;
  }
  .radio-pill input { accent-color: #2E75B6; width: 17px; height: 17px; }
  #submitBtn {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: #2E75B6;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #submitBtn:disabled { background: #9db8cc; cursor: default; }
  #signedInAs {
    font-size: 13px;
    color: #226b4e;
    background: #e2f2ea;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 18px;
  }
  #message {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
  }
  #message.ok   { display: block; background: #e2f2ea; color: #226b4e; }
  #message.err  { display: block; background: #fbe4e4; color: #92200d; }
  .hidden { display: none !important; }
  .card + .card { margin-top: 16px; }
  h2 { font-size: 16px; margin: 0 0 14px; color: #1F4E79; }
  .req-item {
    border: 1px solid #e2e6ea;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 13.5px;
  }
  .req-item .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .req-status {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .req-status.wait { background: #fff2cc; color: #7f6000; }
  .req-status.done { background: #e2f2ea; color: #226b4e; }
  .req-edit-btn {
    font-size: 12.5px;
    padding: 5px 12px;
    border: 1px solid #2E75B6;
    color: #2E75B6;
    background: #fff;
    border-radius: 999px;
    cursor: pointer;
  }
  #editingNotice {
    display: none;
    background: #fff2cc;
    color: #7f6000;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>打刻修正依頼</h1>
  <p class="sub">打刻ミスの修正を依頼するフォームです。送信後、総務が確認して打刻ログへ反映します。</p>

  <div id="loginArea">
    <div id="g_id_onload"
         data-client_id="800178947678-ue8faa8jscidc84656i4ch1d4j0n9lks.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_select="true"
         data-cancel_on_tap_outside="false">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
  </div>

  <div id="formArea" class="hidden">
    <div id="signedInAs"></div>

    <p id="editingNotice"></p>

    <label for="taishouDate">修正対象日</label>
    <input type="date" id="taishouDate">

    <label>修正内容</label>
    <div class="radio-group" id="contentGroup">
      <label class="radio-pill"><input type="radio" name="content" value="出勤時刻の修正"> 出勤時刻の修正</label>
      <label class="radio-pill"><input type="radio" name="content" value="退勤時刻の修正"> 退勤時刻の修正</label>
      <label class="radio-pill"><input type="radio" name="content" value="外出時刻の修正"> 外出時刻の修正</label>
      <label class="radio-pill"><input type="radio" name="content" value="帰社時刻の修正"> 帰社時刻の修正</label>
      <label class="radio-pill"><input type="radio" name="content" value="打刻の追加"> 打刻の追加</label>
      <label class="radio-pill"><input type="radio" name="content" value="打刻の削除"> 打刻の削除</label>
    </div>

    <div id="addTypeArea" class="hidden">
      <label>対象の打刻種別</label>
      <div class="radio-group" id="addTypeGroup">
        <label class="radio-pill"><input type="radio" name="addType" value="出勤"> 出勤</label>
        <label class="radio-pill"><input type="radio" name="addType" value="退勤"> 退勤</label>
        <label class="radio-pill"><input type="radio" name="addType" value="外出"> 外出</label>
        <label class="radio-pill"><input type="radio" name="addType" value="帰社"> 帰社</label>
      </div>
    </div>

    <div id="timeArea">
      <label for="jissaiTime">正しい時刻</label>
      <input type="time" id="jissaiTime">
      <p class="hint" id="actualPunchHint"></p>
    </div>

    <label for="riyu">修正理由</label>
    <textarea id="riyu" placeholder="例：退勤の打刻を忘れた"></textarea>

    <button id="submitBtn">送信</button>
    <button id="cancelEditBtn" class="hidden" style="width:100%;margin-top:10px;padding:11px;font-size:14px;background:#fff;color:#666;border:1px solid #ccc;border-radius:6px;cursor:pointer;">編集をやめて新規作成に戻る</button>
    <div id="message"></div>
  </div>
</div>

<div class="card hidden" id="myRequestsCard">
  <h2>自分の申請一覧</h2>
  <div id="myRequestsList"></div>
</div>

<script>
  // ── PWAインストール対応 ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // ── GAS呼び出し先URL ──
  // verifyGoogleToken_・getActualPunch・submitShuuseiはSession.getActiveUser()を使わず
  // トークン自体を検証する方式なので、アクセス制限の無いタブレット用デプロイのURLを使う
  // （制限ありのデプロイをクロスオリジンで呼ぶとCORSでブロックされるため。実機検証済み）
  const GAS_URL = 'https://script.google.com/a/macros/nishikaru.co.jp/s/AKfycbzht6wuAjcOKeiGL20sHIEE1ip10b7haJfb5lFNahg7XN-ZBKZtwhxE3sfPhydCA21xYg/exec';

  let idToken = null;
  let myEmail = null;
  let editingAppId = null; // nullなら新規作成、appIdが入っていれば編集中

  const contentToDakokuType = {
    '出勤時刻の修正': '出勤',
    '退勤時刻の修正': '退勤',
    '外出時刻の修正': '外出',
    '帰社時刻の修正': '帰社',
  };

  // ── ラジオボタンの値の読み書き用ヘルパー（selectのvalueと同じ感覚で使えるように） ──
  function getRadioValue(name) {
    const el = document.querySelector('input[name="' + name + '"]:checked');
    return el ? el.value : '';
  }
  function setRadioValue(name, value) {
    document.querySelectorAll('input[name="' + name + '"]').forEach((el) => { el.checked = (el.value === value); });
  }

  function handleCredentialResponse(response) {
    idToken = response.credential;
    // ここでは画面表示用にトークンの中身をそのままデコードするだけ（改ざんされていても
    // 見た目が変わるだけで実害はない）。実際の本人確認は各API呼び出し時にGAS側
    // （verifyGoogleToken_）が毎回トークンをGoogleに照会して行う（なりすまし防止）
    const payload = JSON.parse(atob(idToken.split('.')[1]));
    myEmail = payload.email;
    document.getElementById('signedInAs').textContent = 'ログイン中：' + myEmail;
    document.getElementById('loginArea').classList.add('hidden');
    document.getElementById('formArea').classList.remove('hidden');
    document.getElementById('myRequestsCard').classList.remove('hidden');
    loadMyRequests();
  }

  // ── 自分の申請一覧 ──
  function loadMyRequests() {
    const listEl = document.getElementById('myRequestsList');
    listEl.textContent = '読み込み中...';
    fetch(GAS_URL + '?mode=myShuuseiRequests&token=' + encodeURIComponent(idToken))
      .then((r) => r.json())
      .then((data) => {
        if (!data.success) { listEl.textContent = '取得できませんでした：' + data.error; return; }
        if (data.list.length === 0) { listEl.textContent = 'まだ申請はありません。'; return; }
        listEl.innerHTML = '';
        data.list.forEach((req) => {
          const isWait = req.status === '対応待';
          const div = document.createElement('div');
          div.className = 'req-item';
          div.innerHTML =
            '<div class="row"><strong>' + req.taishouDate + '　' + req.content + '</strong>' +
            '<span class="req-status ' + (isWait ? 'wait' : 'done') + '">' + req.status + '</span></div>' +
            '<div>' + (req.jissaiTime ? '正しい時刻：' + req.jissaiTime + '　' : '') + '理由：' + req.riyu + '</div>';
          if (isWait) {
            const btn = document.createElement('button');
            btn.className = 'req-edit-btn';
            btn.textContent = '編集する';
            btn.style.marginTop = '8px';
            btn.addEventListener('click', () => startEditing(req));
            div.appendChild(btn);
          }
          listEl.appendChild(div);
        });
      })
      .catch(() => { listEl.textContent = '取得中にエラーが発生しました。'; });
  }

  function startEditing(req) {
    editingAppId = req.appId;
    dateInput.value = req.taishouDate.replace(/\//g, '-');
    setRadioValue('content', req.content);
    setRadioValue('addType', req.addType || '');
    jissaiTimeInput.value = req.jissaiTime || '';
    document.getElementById('riyu').value = req.riyu;
    updateFieldVisibility();
    document.getElementById('editingNotice').style.display = 'block';
    document.getElementById('editingNotice').textContent = '申請ID「' + req.appId + '」を編集中です。';
    document.getElementById('cancelEditBtn').classList.remove('hidden');
    document.getElementById('submitBtn').textContent = '更新する';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function stopEditing() {
    editingAppId = null;
    dateInput.value = '';
    setRadioValue('content', '');
    setRadioValue('addType', '');
    jissaiTimeInput.value = '';
    document.getElementById('riyu').value = '';
    hintEl.textContent = '';
    updateFieldVisibility();
    document.getElementById('editingNotice').style.display = 'none';
    document.getElementById('cancelEditBtn').classList.add('hidden');
    document.getElementById('submitBtn').textContent = '送信';
  }

  document.getElementById('cancelEditBtn').addEventListener('click', stopEditing);

  const addTypeArea    = document.getElementById('addTypeArea');
  const timeArea       = document.getElementById('timeArea');
  const jissaiTimeInput= document.getElementById('jissaiTime');
  const dateInput      = document.getElementById('taishouDate');
  const hintEl         = document.getElementById('actualPunchHint');

  function updateFieldVisibility() {
    const content = getRadioValue('content');
    addTypeArea.classList.toggle('hidden', content !== '打刻の追加' && content !== '打刻の削除');
    timeArea.classList.toggle('hidden', content === '打刻の削除');
  }

  // 修正対象日・修正内容（○○時刻の修正）が両方揃ったら、現在の実打刻時刻を自動取得して
  // 入力欄に反映する（自動補正機能。ゼロから時刻を入力させない）
  function fetchActualPunch() {
    const content     = getRadioValue('content');
    const dakokuType  = contentToDakokuType[content];
    const dateStr     = dateInput.value; // yyyy-MM-dd
    hintEl.textContent = '';
    if (!dakokuType || !dateStr || !idToken) return;
    const dateStrSlash = dateStr.replace(/-/g, '/');
    hintEl.textContent = '現在の打刻を確認中...';
    fetch(GAS_URL + '?mode=getActualPunch&token=' + encodeURIComponent(idToken) +
      '&date=' + encodeURIComponent(dateStrSlash) + '&dakokuType=' + encodeURIComponent(dakokuType))
      .then((r) => r.json())
      .then((data) => {
        if (!data.success) { hintEl.textContent = '確認できませんでした：' + data.error; return; }
        if (data.time) {
          hintEl.textContent = '現在の実打刻：' + data.time + '（下の欄に自動入力しました。必要に応じて修正してください）';
          jissaiTimeInput.value = data.time;
        } else {
          hintEl.textContent = 'その日・その種別の打刻は見つかりませんでした。';
        }
      })
      .catch(() => { hintEl.textContent = '確認中にエラーが発生しました。'; });
  }

  document.querySelectorAll('input[name="content"]').forEach((r) => {
    r.addEventListener('change', () => { updateFieldVisibility(); fetchActualPunch(); });
  });
  dateInput.addEventListener('change', fetchActualPunch);

  document.getElementById('submitBtn').addEventListener('click', () => {
    const taishouDate = dateInput.value ? dateInput.value.replace(/-/g, '/') : '';
    const content     = getRadioValue('content');
    const addType     = getRadioValue('addType');
    const jissaiTime  = jissaiTimeInput.value;
    const riyu        = document.getElementById('riyu').value.trim();
    const messageEl   = document.getElementById('message');
    messageEl.className = ''; messageEl.textContent = '';

    if (!taishouDate || !content || !riyu) {
      messageEl.className = 'err'; messageEl.textContent = '未入力の項目があります。'; return;
    }
    if ((content === '打刻の追加' || content === '打刻の削除') && !addType) {
      messageEl.className = 'err'; messageEl.textContent = '対象の打刻種別を選んでください。'; return;
    }
    if (content !== '打刻の削除' && !jissaiTime) {
      messageEl.className = 'err'; messageEl.textContent = '正しい時刻を入力してください。'; return;
    }

    const btn = document.getElementById('submitBtn');
    const isEditing = !!editingAppId;
    btn.disabled = true; btn.textContent = isEditing ? '更新中...' : '送信中...';

    const payload = isEditing
      ? { action: 'updateShuusei', token: idToken, appId: editingAppId, taishouDate, content, addType, jissaiTime, riyu }
      : { action: 'submitShuusei', token: idToken, taishouDate, content, addType, jissaiTime, riyu };

    // 2026-08-06：Content-Typeをapplication/jsonにするとCORSのプリフライト（OPTIONS）が
    // 発生し、GAS Web Appは対応していないため失敗する。文字列のままPOSTする
    // （Content-Type省略時はtext/plainになりプリフライトを回避できる。GAS側は
    // e.postData.contentsを文字列として受け取りJSON.parseするので実害は無い）
    fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then((r) => r.json())
      .then((data) => {
        if (data.success) {
          messageEl.className = 'ok';
          messageEl.textContent = (isEditing ? '更新しました' : '送信しました') + '（申請ID：' + data.appId + '）。総務の確認をお待ちください。';
          stopEditing();
          loadMyRequests();
        } else {
          messageEl.className = 'err';
          messageEl.textContent = (isEditing ? '更新できませんでした：' : '送信できませんでした：') + data.message;
        }
      })
      .catch((e) => {
        messageEl.className = 'err';
        messageEl.textContent = '通信エラー：' + e;
      })
      // stopEditing()が成功時に呼ばれてeditingAppIdをリセットしている可能性があるため、
      // ここでは（送信前に固定したisEditingではなく）現在のeditingAppIdを見てラベルを決める
      .finally(() => { btn.disabled = false; btn.textContent = editingAppId ? '更新する' : '送信'; });
  });
</script>
</body>
</html>
